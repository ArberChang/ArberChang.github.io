# 站点定制独立于 npm 主题，升级时无需修改主题源码。
scheme: Pisces
darkmode: false
menu:
  home: / || fa fa-book
  archives: /archives/ || fa fa-archive
  about: /about/ || fa fa-user
  tags: /tags/ || fa fa-tags
  categories: /categories/ || fa fa-clone
  series: /series/ || fa fa-list
  photos: /photos/ || fa fa-film
  sitemap: /sitemap.xml || fa fa-sitemap
avatar:
  url: /images/avatar.gif
  rounded: true
  rotated: true
social:
  GitHub: https://github.com/ArberChang || fab fa-github
  E-Mail: mailto:904105072@qq.com || fa fa-envelope
social_icons:
  enable: false
links:
  Title: https://b.wanty.cn
footer:
  since: 2019
  icon:
    name: fa fa-user
    animated: true
    color: '#808080'
  powered: false
creative_commons:
  language: zh-CN
reading_progress:
  enable: true
bookmark:
  enable: true
github_banner:
  enable: true
  permalink: https://github.com/ArberChang
  title: Follow me on GitHub
index_with_subtitle: true
exturl: true
pjax: true
fancybox: true
mediumzoom: false
lazyload: false
pangu: true
quicklink:
  enable: true
  home: true
  archive: true
math:
  mathjax:
    enable: true
  katex:
    enable: false
algolia_search:
  enable: false
local_search:
  enable: true
busuanzi_count:
  enable: true
  total_visitors: true
  total_views: true
  post_views: false
vendors:
  internal: local
  plugins: custom
  custom_cdn_url: /lib/${npm_name}/${minified}
  mathjax: https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-mml-chtml.js

# 保留已有 Valine 配置，通过独立扩展接入 NexT 8。
valine:
  enable: true
  appId: kLzVPDM5m0lffGBD0YNBky4d-9Nh9j0Va # Your leancloud application appid
  appKey: MGLmOunidhFb6mhCaVc8eWEm # Your leancloud application appkey
  notify: true # Mail notifier
  verify: false # Verification code
  placeholder: "ヾﾉ≧∀≦)o来啊，快活啊!" # Comment box placeholder
  avatar: mm # Gravatar style
  meta: [nick, mail, link] # Custom comment header
  pageSize: 10 # Pagination size
  lang: zh-cn # Language, available values: en, zh-cn
  visitor: true # Article reading statistic
  comment_count: true # If false, comment count will only be displayed in post page, not in home page
  recordIP: true # Whether to record the commenter IP
  serverURLs: # When the custom domain name is enabled, fill it in here (it will be detected automatically by default, no need to fill in)
  #post_meta_order: 0


# 避免浏览器入场动画结束前菜单持续透明；导航无需依赖动画执行。
motion:
  enable: false
